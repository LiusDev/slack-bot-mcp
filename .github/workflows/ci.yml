name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 needs Node >= 22.13; Node 20 runtime is covered by node20-smoke.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  node20-smoke:
    # The published package supports Node >= 20. Build with a newer Node,
    # then check the server completes an MCP handshake on Node 20.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: MCP handshake on Node 20
        env:
          SLACK_BOT_TOKEN: xoxb-ci-placeholder
          SLACK_APP_TOKEN: xapp-ci-placeholder
          SLACK_MCP_LOG_LEVEL: silent
        run: |
          node --version
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          out=$( (echo "$init"; sleep 5) | timeout 20 node dist/index.js 2>/dev/null || true)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'
